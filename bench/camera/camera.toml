# Where the camera is: used by the camera bench only (bench/camera).
#
# Same room frame as config/room.toml and the viewer: metres, origin on the
# floor under the visitor's eyes (the standing spot), x = visitor's right,
# y = up, z = behind the visitor. With the current room.toml (16.5 ft square,
# visitor 2 ft in from the back wall) the walls are at:
#   front wall  z = -4.42      side walls  x = -2.51 (left) / +2.51 (right)
#   back wall   z = +0.61      ceiling     y = 3.05 (unconfirmed)
#
# Examples:
#   desk test, laptop in front of you:   x = 0,     y = 1.3, z = -0.6
#   front-right corner, 2.5 m high:      x = 2.45,  y = 2.5, z = -4.36
#   front-left corner, 2.5 m high:       x = -2.45, y = 2.5, z = -4.36
#   above the middle screen:             x = 0,     y = 3.0, z = -4.36
#
# The bench works out which way the camera faces (bearing and tilt) from these
# two points and prints it at startup. --bearing / --tilt on the command line
# still override it.

[camera]
x_m = 0.0
y_m = 1.3
z_m = -0.6

# The point the camera is aimed at. Default: the visitor's chest on the
# standing spot. For the bench to be right, the camera must actually be aimed
# there, with no sideways roll.
[aim]
x_m = 0.0
y_m = 1.3
z_m = 0.0
